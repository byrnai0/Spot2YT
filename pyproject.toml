[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify2yt"
version = "0.1.0"
description = "Local Spotify -> YouTube Music playlist transfer CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "spotipy>=2.24",
    "ytmusicapi>=1.10",
    "rapidfuzz>=3.9",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.scripts]
s2y = "spotify2yt.cli:main"

[tool.setuptools.packages.find]
include = ["spotify2yt*"]
